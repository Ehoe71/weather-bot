name: Crypto Price Bot

on:
  schedule:
    # Запуск раз в сутки в 10:00 по Кургану (05:00 UTC)
    - cron: '0 5 * * *'
  workflow_dispatch:  # Для ручного теста

jobs:
  send-crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run crypto script
        run: python crypto_bot.py

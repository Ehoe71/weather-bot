name: Crypto Price Bot

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  send-crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run crypto script
        run: python crypto_bot.py

name: Weather Push Notification

on:
  schedule:
    # Запуск каждые 2 часа с 6:00 до 18:00 по Кургану (UTC+5).
    # 6:00 Курган = 1:00 UTC, 18:00 Курган = 13:00 UTC.
    - cron: '0 1,3,5,7,9,11,13 * * *'
  workflow_dispatch:  # Позволяет запустить вручную для теста

jobs:
  send-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run weather script
        run: python weather_bot.py
